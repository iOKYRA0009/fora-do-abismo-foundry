name: Publish Foundry Module

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MODULE_ID: fora-do-abismo-foundry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' module.json)"
          MODULE_ID_FROM_MANIFEST="$(jq -r '.id' module.json)"

          if [[ "$MODULE_ID_FROM_MANIFEST" != "$MODULE_ID" ]]; then
            echo "Manifest id '$MODULE_ID_FROM_MANIFEST' does not match '$MODULE_ID'."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in module.json: $VERSION"
            exit 1
          fi

          jq -e '.id and .title and .version and .compatibility and .esmodules and .manifest and .download' module.json >/dev/null

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/main.js
          node --check scripts/scenes/scene-builder.js
          node --check scripts/scenes/forjas-presets.js
          node --check scripts/scenes/scene-blueprint-validator.js
          node --check scripts/scenes/framework/scene-framework.js
          node --check scripts/scenes/templates/core-templates.js
          node --check scripts/scenes/skins/core-skins.js
          node --check scripts/scenes/presets/core-presets.js
          jq -e . schemas/jarvis-scene-v1.schema.json >/dev/null
          jq -e . schemas/jarvis-scene-v2.schema.json >/dev/null

      - name: Check whether this version already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.manifest.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists. Bump module.json version to publish new code."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Foundry release package
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.manifest.outputs.version }}"
          TAG="${{ steps.manifest.outputs.tag }}"
          RELEASE_DIR="release-tree"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$MODULE_ID.zip"

          rm -rf "$RELEASE_DIR" "$MODULE_ID.zip"
          mkdir -p "$RELEASE_DIR"

          cp module.json "$RELEASE_DIR/module.json"
          cp -r scripts "$RELEASE_DIR/"
          cp -r styles "$RELEASE_DIR/"
          cp -r schemas "$RELEASE_DIR/"
          cp README.md "$RELEASE_DIR/README.md"

          for optional_dir in assets lang templates packs; do
            if [[ -d "$optional_dir" ]]; then
              cp -r "$optional_dir" "$RELEASE_DIR/"
            fi
          done

          # Foundry V14 is more reliable with raster textures for full-canvas map art.
          # Keep SVG sources in the repository, but ship WEBP siblings in the release.
          if compgen -G "$RELEASE_DIR/assets/maps/forjas-*.svg" > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends librsvg2-bin webp

            for svg in "$RELEASE_DIR"/assets/maps/forjas-*.svg; do
              png="${svg%.svg}.png"
              webp="${svg%.svg}.webp"
              rsvg-convert "$svg" -o "$png"
              cwebp -quiet -q 88 "$png" -o "$webp"
              rm -f "$png"
              test -s "$webp"
              echo "Rasterized: $webp"
            done
          fi

          for required_map in forjas-01.webp forjas-02.webp forjas-03.webp; do
            test -s "$RELEASE_DIR/assets/maps/$required_map" || {
              echo "Missing raster map: $required_map"
              exit 1
            }
          done

          jq \
            --arg version "$VERSION" \
            --arg download "$DOWNLOAD_URL" \
            '.version = $version | .download = $download' \
            "$RELEASE_DIR/module.json" > "$RELEASE_DIR/module.tmp.json"

          mv "$RELEASE_DIR/module.tmp.json" "$RELEASE_DIR/module.json"

          jq -e '.id == "fora-do-abismo-foundry"' "$RELEASE_DIR/module.json" >/dev/null
          jq -e '.manifest | contains("/releases/latest/download/module.json")' "$RELEASE_DIR/module.json" >/dev/null
          jq -e '.download | contains("/releases/download/v")' "$RELEASE_DIR/module.json" >/dev/null

          (
            cd "$RELEASE_DIR"
            zip -r "../$MODULE_ID.zip" .
          )

          echo "Release package contents:"
          unzip -l "$MODULE_ID.zip"

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.manifest.outputs.tag }}"
          VERSION="${{ steps.manifest.outputs.version }}"

          # A release is intentionally published as a normal GitHub release even
          # when the semantic version contains an alpha/beta suffix. GitHub's
          # /releases/latest/ endpoint ignores prereleases, and Foundry relies on
          # that stable URL for installation and update checks.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fora do Abismo — Jarvis Tools $VERSION" \
            --generate-notes

      - name: Upload Foundry assets
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.manifest.outputs.tag }}"
          gh release upload "$TAG" \
            "release-tree/module.json" \
            "$MODULE_ID.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
