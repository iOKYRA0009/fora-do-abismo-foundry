name: Smart Import candidate validation
on:
  push:
    branches:
      - jarvis/smart-import-1.5.11
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
